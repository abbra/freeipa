# Azure gating job 'external_ca_ExternalCA'.
name: azure-external-ca
domain: ipa.test
dist: 44
image: freeipa-ci/full:44
hosts:
  - {role: master, name: master1}
  - {role: replica, name: replica1}
  - {role: client, name: client1}
resources:
  replica: {memory: 2200m, memory-swap: 3300m}
  client: {memory: 768m, memory-swap: 1024m}
run:
  mode: integration
  tests: [test_integration/test_external_ca.py::TestExternalCA]
