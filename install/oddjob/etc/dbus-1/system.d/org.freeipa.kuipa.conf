<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.freeipa.kuipa"/>
    <allow send_destination="org.freeipa.kuipa" send_interface="org.freeipa.kuipa"/>
  </policy>
  <policy user="ipaapi">
    <allow send_destination="org.freeipa.kuipa" send_interface="org.freeipa.kuipa"/>
  </policy>
</busconfig>
