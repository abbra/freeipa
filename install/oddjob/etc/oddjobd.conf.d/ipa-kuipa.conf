<?xml version="1.0"?>
<oddjobconfig>
  <service name="org.freeipa.kuipa">
    <allow user="root"/>
    <allow user="ipaapi"/>
    <object name="/">
      <interface name="org.freeipa.kuipa">
        <method name="kuipa_enrollment_string">
          <helper exec="/usr/libexec/ipa/oddjob/org.freeipa.kuipa-enrollment-string"
                  arguments="0"
                  prepend_user_name="no"
                  argument_passing_method="cmdline"/>
        </method>
      </interface>
    </object>
  </service>
</oddjobconfig>
