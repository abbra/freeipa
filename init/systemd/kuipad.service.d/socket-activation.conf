# kuipad.service is shipped by the kuipa-server package; this drop-in is
# shipped by freeipa-server and is what ties it to the socket.
#
# kuipad accepts the pre-bound /run/ipa/kuipad.sock from kuipad.socket when
# it inherits one ($LISTEN_FDS).  Started on its own it binds that path from
# the "listen" key of /etc/ipa/kuipad.json -- and because it does not chmod
# the path it creates, the socket would end up 0640 root:root and mod_proxy
# (which connects as the apache user) could not reach it.  So the socket unit
# is not optional here: Require= makes it a hard dependency and BindsTo= makes
# systemd start it whenever kuipad.service is started -- by ipactl, by
# 'systemctl start kuipad', or at boot.  It stays inactive when kuipad.service
# is stopped, exactly as the socket unit's own PartOf=kuipad.service does.
#
# A drop-in rather than a Requires=/BindsTo= in the unit itself: the unit
# belongs to the kuipa package, which must also work on a host that runs
# kuipad stand-alone, binding its own socket.
[Unit]
Requires=kuipad.socket
BindsTo=kuipad.socket
After=kuipad.socket
